name: Generate config file

on:
  push:
    branches:
      - main
    paths:
      - 'meme/**'
      - 'shell/computed.sh'
      - 'shell/generate_config.py'
      - 'shell/catalog_git.py'
      - '.github/workflows/generate-config-file.yml'

concurrency:
  group: generated-catalogs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate-config-file:
    name: Generate config file
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and publish config
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in {1..5}; do
            git fetch origin main
            git reset --hard origin/main
            ./shell/computed.sh
            git add static/scripts/config.js static/data/meme-entry-ids.json

            if git diff --cached --quiet; then
              echo "Config is already up to date."
              exit 0
            fi

            git commit -m 'chore: update config file'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main changed while publishing; retrying ($attempt/5)..."
            sleep $((attempt * 3))
          done

          echo "Unable to publish config after 5 attempts."
          exit 1
