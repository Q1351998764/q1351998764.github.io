name: Generate text config

on:
  push:
    branches:
      - main
    paths:
      - 'art/**'
      - 'shell/catalog_git.py'
      - 'shell/generate_text_config.py'
      - '.github/workflows/generate-article-page.yml'

concurrency:
  group: generated-catalogs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate-text-config:
    name: Generate text config
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and publish text config
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in {1..5}; do
            git fetch origin main
            git reset --hard origin/main
            python ./shell/generate_text_config.py
            git add static/scripts/text-config.js

            if git diff --cached --quiet; then
              echo "Text config is already up to date."
              exit 0
            fi

            git commit -m 'chore: update text config'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main changed while publishing; retrying ($attempt/5)..."
            sleep $((attempt * 3))
          done

          echo "Unable to publish text config after 5 attempts."
          exit 1
